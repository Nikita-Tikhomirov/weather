# Static analysis configuration for the Family Todo mobile app.
#
# Activates the recommended Flutter lint set and adds extra rules
# to catch common mistakes, empty catch blocks, and undocumented
# public members.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat missing returns as errors, not warnings.
    missing_return: error
    # Dead code is always a bug.
    dead_code: error
    # Empty catch blocks hide failures — require at least a comment.
    empty_catches: error

linter:
  rules:
    # ── Error prevention ──
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_slow_async_io
    - avoid_types_as_parameter_names
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - no_duplicate_case_values
    - prefer_final_locals
    - unnecessary_brace_in_string_interps
    - use_build_context_synchronously
