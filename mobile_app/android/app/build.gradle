plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def buildNumberEnv = System.getenv("BUILD_NUMBER")
def releaseVersionCode = 1
if (buildNumberEnv != null && buildNumberEnv ==~ /\d+/) {
    releaseVersionCode = buildNumberEnv.toInteger()
}
def releaseVersionName = System.getenv("APP_VERSION") ?: "0.1.6"
def isReleaseTask = gradle.startParameter.taskNames.any {
    it.toString().toLowerCase().contains("release")
}
def envOrProperty = { name ->
    def envValue = System.getenv(name)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    def propertyValue = project.findProperty(name)
    if (propertyValue != null && !propertyValue.toString().trim().isEmpty()) {
        return propertyValue.toString()
    }
    return ""
}
def requiredReleaseValue = { name, devDefault ->
    def value = envOrProperty(name)
    if (isReleaseTask && value.isEmpty()) {
        throw new GradleException("${name} is required for Android release builds")
    }
    return value.isEmpty() ? devDefault : value
}
def buildConfigString = { value ->
    return "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}
def pushApiBaseUrl = requiredReleaseValue("API_BASE_URL", "http://31.129.97.211")
def pushApiKey = requiredReleaseValue("API_KEY", "dev-local-key")

android {
    namespace "com.example.family_todo_mobile"
    compileSdk 36
    ndkVersion "28.2.13676358"

    signingConfigs {
        release {
            def storeFileEnv = System.getenv("SIGNING_STORE_FILE")
            if (storeFileEnv != null && !storeFileEnv.isEmpty()) {
                storeFile file(storeFileEnv)
            }
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.family_todo_mobile"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode releaseVersionCode
        versionName releaseVersionName
        buildConfigField "String", "PUSH_API_BASE_URL", buildConfigString(pushApiBaseUrl)
        buildConfigField "String", "PUSH_API_KEY", buildConfigString(pushApiKey)
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation platform("com.google.firebase:firebase-bom:33.4.0")
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "com.google.android.gms:play-services-base:18.5.0"
    implementation "com.google.firebase:firebase-installations"
    implementation "com.google.firebase:firebase-messaging"
}

flutter {
    source "../.."
}
