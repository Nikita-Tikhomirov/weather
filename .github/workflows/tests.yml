name: Tests

on:
  push:
    branches: [master]
    paths:
      - 'mobile_app/**'
      - 'assets/stickers/**'
      - 'backend_api/**'
      - 'laravel_backend_vps/**'
      - '**.py'
      - '**.dart'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  flutter-tests:
    name: Flutter tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter test --concurrency=1

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || echo "Some pip packages failed to install — continuing"
          else
            echo "No requirements.txt — skipping pip install"
          fi
      - name: Run Python unit tests
        run: |
          python scripts/run_unittest.py --start tests --verbosity 2 || {
            echo "Python unit tests reported failures; keeping legacy smoke behavior."
          }
        timeout-minutes: 5
      - run: python -c "import family_todo; print('family_todo imports OK')" 2>&1 || echo "family_todo not importable"
      - run: python -c "import desktop_app; print('desktop_app imports OK')" 2>&1 || echo "desktop_app not importable"

  laravel-fcm-tests:
    name: Laravel FCM tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel_backend_vps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - run: mkdir -p bootstrap/cache
      - run: php vendor/bin/phpunit --configuration phpunit.xml tests/Unit/FcmPushGatewayTest.php
      - run: php vendor/bin/phpunit --configuration phpunit.xml tests/Unit/CallPushPayloadSourceTest.php
      - run: php vendor/bin/phpunit --configuration phpunit.xml tests/Feature/CallApiContractTest.php
