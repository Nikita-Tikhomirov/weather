name: Kwork Lead Funnel APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-apk.yml'

permissions:
  contents: write

concurrency:
  group: kwork-lead-funnel-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.44.0
      APPLICATION_ID: com.example.family_todo_mobile.installable
      APP_LABEL: Kwork Lead Funnel
      APP_VERSION: 0.2.0

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        timeout-minutes: 5
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Prepare isolated Flutter project
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="/tmp/kwork_lead_funnel"
          flutter create --platforms=android --project-name family_todo_mobile --org com.example "$APP_DIR"
          rm -f "$APP_DIR/android/build.gradle.kts" "$APP_DIR/android/app/build.gradle.kts"
          rm -rf "$APP_DIR/lib" "$APP_DIR/test"
          cp -R mobile_app/lib "$APP_DIR/lib"
          cp -R mobile_app/test "$APP_DIR/test"
          cp mobile_app/pubspec.yaml "$APP_DIR/pubspec.yaml"
          cp mobile_app/pubspec.lock "$APP_DIR/pubspec.lock"
          cp mobile_app/analysis_options.yaml "$APP_DIR/analysis_options.yaml"
          mkdir -p "$APP_DIR/.github/workflows"
          cp .github/workflows/mobile-apk.yml "$APP_DIR/.github/workflows/mobile-apk.yml"
          cp mobile_app/android/build.gradle "$APP_DIR/android/build.gradle"
          cp mobile_app/android/settings.gradle "$APP_DIR/android/settings.gradle"
          cp mobile_app/android/gradle.properties "$APP_DIR/android/gradle.properties"
          cp mobile_app/android/app/build.gradle "$APP_DIR/android/app/build.gradle"
          cp mobile_app/android/app/google-services.json "$APP_DIR/android/app/google-services.json"
          cp mobile_app/android/app/src/main/AndroidManifest.xml "$APP_DIR/android/app/src/main/AndroidManifest.xml"
          cp -a mobile_app/android/app/src/main/res/. "$APP_DIR/android/app/src/main/res/"
          if [ -d mobile_app/android/app/src/main/kotlin ]; then
            cp -a mobile_app/android/app/src/main/kotlin/. "$APP_DIR/android/app/src/main/kotlin/"
          fi

      - name: Install dependencies and run Flutter tests
        run: |
          cd /tmp/kwork_lead_funnel
          flutter pub get
          flutter test --concurrency=1

      - name: Restore lead app signing key
        env:
          LEAD_FUNNEL_KEYSTORE_BASE64: ${{ secrets.LEAD_FUNNEL_KEYSTORE_BASE64 }}
          LEAD_FUNNEL_KEYSTORE_PASSWORD: ${{ secrets.LEAD_FUNNEL_KEYSTORE_PASSWORD }}
          LEAD_FUNNEL_KEY_ALIAS: ${{ secrets.LEAD_FUNNEL_KEY_ALIAS }}
          LEAD_FUNNEL_KEY_PASSWORD: ${{ secrets.LEAD_FUNNEL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in LEAD_FUNNEL_KEYSTORE_BASE64 LEAD_FUNNEL_KEYSTORE_PASSWORD LEAD_FUNNEL_KEY_ALIAS LEAD_FUNNEL_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required to publish an updateable Kwork Lead Funnel APK."
              exit 1
            fi
          done
          KEYSTORE="/tmp/kwork_lead_funnel/android/kwork-lead-funnel.keystore"
          echo "$LEAD_FUNNEL_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$LEAD_FUNNEL_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$LEAD_FUNNEL_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$LEAD_FUNNEL_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Kwork Lead Funnel APK
        timeout-minutes: 20
        env:
          API_BASE_URL: ${{ secrets.MOBILE_API_BASE_URL }}
          API_KEY: ${{ secrets.TODO_BACKEND_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          TURN_URLS: ${{ secrets.TURN_URLS }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          BRIDGE_DEFAULT_HOST: ${{ secrets.BRIDGE_DEFAULT_HOST }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/kwork_lead_funnel
          for name in API_BASE_URL API_KEY FIREBASE_APP_ID FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_API_KEY FIREBASE_STORAGE_BUCKET TURN_URLS TURN_USERNAME TURN_CREDENTIAL BRIDGE_DEFAULT_HOST; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for a production APK."
              exit 1
            fi
          done
          set +e
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number="$BUILD_NUMBER" \
            --build-name="$APP_VERSION" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_KEY="$API_KEY" \
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET" \
            --dart-define=TURN_URLS="$TURN_URLS" \
            --dart-define=TURN_USERNAME="$TURN_USERNAME" \
            --dart-define=TURN_CREDENTIAL="$TURN_CREDENTIAL" \
            --dart-define=BRIDGE_DEFAULT_HOST="$BRIDGE_DEFAULT_HOST" \
            --dart-define=APP_VERSION="$APP_VERSION"
          BUILD_EXIT=$?
          set -e
          APK_PATH="$(find build android/app/build -type f \( -path '*/flutter-apk/*release*.apk' -o -path '*/outputs/apk/*release*.apk' -o -name 'app-release.apk' \) 2>/dev/null | head -n 1 || true)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release build did not produce an APK."
            if [ "$BUILD_EXIT" -ne 0 ]; then
              exit "$BUILD_EXIT"
            fi
            exit 1
          fi
          mkdir -p /tmp/apk-artifacts
          cp "$APK_PATH" /tmp/apk-artifacts/kwork-lead-funnel.apk

      - name: Verify package identifier
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -path '*/build-tools/*/aapt' -type f 2>/dev/null | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging /tmp/apk-artifacts/kwork-lead-funnel.apk | grep -F "package: name='com.example.family_todo_mobile.installable'"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwork-lead-funnel-apk
          path: /tmp/apk-artifacts/kwork-lead-funnel.apk

      - name: Publish GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=/tmp/apk-artifacts/kwork-lead-funnel.apk
          VERSION_TAG="kwork-lead-funnel-v${{ github.run_number }}"
          gh release create "$VERSION_TAG" --title "Kwork Lead Funnel v${{ github.run_number }}" --generate-notes "$APK"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git tag -f latest
          git push origin latest --force
          gh release create latest --title "Kwork Lead Funnel - Latest" --notes "Отдельное приложение для работы с заказами Kwork." "$APK"
