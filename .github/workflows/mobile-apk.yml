name: Mobile APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-apk.yml'

permissions:
  contents: write

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: 3.44.0
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      ALLOWED_SIGN_SHA1_HEX: F7A5772750EC4971DBE14BEEB4144E5895DD9852,8067ED1EB450CD96421330E19BC305DD3EC553F0,F55E7F7C6AA047F6A27BB6FBC23C0ECE15A3BD71

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 36
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$ANDROID_SDK_ROOT" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || \
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" || \
            echo "SDK 36 install attempted; continuing"
          fi

      - name: Set up Flutter
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_DIR="$RUNNER_TEMP/flutter"
          rm -rf "$FLUTTER_DIR"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_DIR"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          "$FLUTTER_DIR/bin/flutter" --version
          "$FLUTTER_DIR/bin/flutter" config --no-analytics

      - name: Prepare isolated Flutter project
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="/tmp/family_todo_mobile"
          rm -rf "$APP_DIR"
          flutter create --platforms=android --project-name family_todo_mobile --org com.example "$APP_DIR"
          rm -f "$APP_DIR/android/build.gradle.kts"
          rm -f "$APP_DIR/android/app/build.gradle.kts"

          rm -rf "$APP_DIR/lib"
          cp -R mobile_app/lib "$APP_DIR/lib"
          if [ -d mobile_app/test ]; then
            rm -rf "$APP_DIR/test"
            cp -R mobile_app/test "$APP_DIR/test"
          fi
          cp mobile_app/pubspec.yaml "$APP_DIR/pubspec.yaml"
          if [ -f mobile_app/pubspec.lock ]; then
            cp mobile_app/pubspec.lock "$APP_DIR/pubspec.lock"
          fi
          if [ -f mobile_app/analysis_options.yaml ]; then
            cp mobile_app/analysis_options.yaml "$APP_DIR/analysis_options.yaml"
          fi
          if [ -f mobile_app/android/build.gradle ]; then
            cp mobile_app/android/build.gradle "$APP_DIR/android/build.gradle"
          fi
          if [ -f mobile_app/android/settings.gradle ]; then
            rm -f "$APP_DIR/android/settings.gradle.kts"
            cp mobile_app/android/settings.gradle "$APP_DIR/android/settings.gradle"
          fi
          if [ -f mobile_app/android/gradle.properties ]; then
            cp mobile_app/android/gradle.properties "$APP_DIR/android/gradle.properties"
          fi
          if [ -f mobile_app/android/app/build.gradle ]; then
            cp mobile_app/android/app/build.gradle "$APP_DIR/android/app/build.gradle"
          fi
          if [ -f mobile_app/android/app/google-services.json ]; then
            cp mobile_app/android/app/google-services.json "$APP_DIR/android/app/google-services.json"
          fi
          if [ -f mobile_app/android/app/src/main/AndroidManifest.xml ]; then
            cp mobile_app/android/app/src/main/AndroidManifest.xml "$APP_DIR/android/app/src/main/AndroidManifest.xml"
          fi
          if [ -d mobile_app/android/app/src/main/res ]; then
            rm -rf "$APP_DIR/android/app/src/main/res"
            cp -R mobile_app/android/app/src/main/res "$APP_DIR/android/app/src/main/res"
          fi
          if [ -d mobile_app/android/app/src/main/kotlin ]; then
            rm -rf "$APP_DIR/android/app/src/main/kotlin"
            cp -R mobile_app/android/app/src/main/kotlin "$APP_DIR/android/app/src/main/kotlin"
          fi
          if [ -d mobile_app/android/app/src/main/java ]; then
            cp -R mobile_app/android/app/src/main/java "$APP_DIR/android/app/src/main/java"
          fi

      - name: Flutter pub get
        run: |
          cd /tmp/family_todo_mobile
          flutter pub get

      - name: Flutter tests
        run: |
          cd /tmp/family_todo_mobile
          flutter test --concurrency=1

      - name: Restore fallback release keystore cache
        uses: actions/cache@v4
        with:
          path: /tmp/family_todo_mobile/android/release.keystore
          key: family-todo-release-keystore-v1

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR="/tmp/family_todo_mobile"
          STORE_PASSWORD="${RELEASE_KEYSTORE_PASSWORD:-familytodo123}"
          KEY_ALIAS="${RELEASE_KEY_ALIAS:-familytodo}"
          KEY_PASSWORD="${RELEASE_KEY_PASSWORD:-familytodo123}"

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_KEYSTORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/android/release.keystore"
            echo "Using release keystore from GitHub secrets"
            echo "SIGNING_KEY_SOURCE=secrets" >> "$GITHUB_ENV"
          elif [ -f "$APP_DIR/android/release.keystore" ]; then
            echo "::warning::Using cached fallback release keystore. Configure RELEASE_KEYSTORE_* secrets for stable production signing."
            echo "SIGNING_KEY_SOURCE=fallback" >> "$GITHUB_ENV"
          else
            echo "::warning::Generating fallback release keystore. Configure RELEASE_KEYSTORE_* secrets for stable production signing."
            keytool -genkeypair \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storetype JKS \
              -keystore "$APP_DIR/android/release.keystore" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Family Todo, OU=Local, O=Local, L=Moscow, S=Moscow, C=RU"
            echo "SIGNING_KEY_SOURCE=fallback" >> "$GITHUB_ENV"
          fi
          echo "SIGNING_STORE_FILE=$APP_DIR/android/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        timeout-minutes: 20
        env:
          API_BASE_URL: http://31.129.97.211
          API_KEY: ${{ secrets.TODO_BACKEND_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          BUILD_NUMBER: ${{ github.run_number }}
          APP_VERSION: 0.1.8
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/family_todo_mobile
          rm -f /tmp/family_todo_mobile/flutter_build.log
          set +e
          timeout 18m flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-number="$BUILD_NUMBER" \
            --build-name="$APP_VERSION" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=API_KEY="${API_KEY:-dev-local-key}" \
            --dart-define=FIREBASE_APP_ID="${FIREBASE_APP_ID:-1:223906415067:android:68a62bb31cc4471895a7fe}" \
            --dart-define=FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID:-famillytodo-2758f}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${FIREBASE_MESSAGING_SENDER_ID:-223906415067}" \
            --dart-define=FIREBASE_API_KEY="${FIREBASE_API_KEY:-AIzaSyBtO5Nbcb91lk3WViNIHzwYX_5yazfG6K8}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${FIREBASE_STORAGE_BUCKET:-famillytodo-2758f.firebasestorage.app}" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            2>&1 | tee /tmp/family_todo_mobile/flutter_build.log
          BUILD_EXIT=$?
          set -e

          APK_PATH="/tmp/family_todo_mobile/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="$(find /tmp/family_todo_mobile /tmp/family_todo_mobile/android/app/build -type f \( -path '*/flutter-apk/*release*.apk' -o -path '*/outputs/apk/*release*.apk' -o -name 'app-release.apk' \) 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "No APK found after flutter build. Trying Gradle assembleRelease fallback..."
            (cd /tmp/family_todo_mobile/android && ./gradlew --no-daemon assembleRelease) 2>&1 | tee -a /tmp/family_todo_mobile/flutter_build.log || true
            APK_PATH="$(find /tmp/family_todo_mobile /tmp/family_todo_mobile/android/app/build -type f \( -path '*/flutter-apk/*release*.apk' -o -path '*/outputs/apk/*release*.apk' -o -name '*.apk' \) 2>/dev/null | head -n 1 || true)"
          fi

          echo "Detected APK candidates:"
          find /tmp/family_todo_mobile /tmp/family_todo_mobile/android/app/build -type f -name '*.apk' 2>/dev/null || true

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::group::Flutter build failure tail"
            tail -n 120 /tmp/family_todo_mobile/flutter_build.log || true
            echo "::endgroup::"
            ERROR_TAIL="$(tail -n 20 /tmp/family_todo_mobile/flutter_build.log | tr '\n' ' ' | tr -s ' ')"
            if [ -n "$ERROR_TAIL" ]; then
              echo "::error::flutter build failed: $ERROR_TAIL"
            fi
          fi

          if [ -n "$APK_PATH" ]; then
            mkdir -p /tmp/family_todo_mobile/build/app/outputs/flutter-apk
            cp "$APK_PATH" /tmp/family_todo_mobile/build/app/outputs/flutter-apk/app-release.apk
          elif [ "$BUILD_EXIT" -ne 0 ]; then
            exit "$BUILD_EXIT"
          else
            echo "::error::APK file was not produced."
            exit 1
          fi

      - name: Rename artifact
        run: |
          cp /tmp/family_todo_mobile/build/app/outputs/flutter-apk/app-release.apk /tmp/family_todo_mobile/build/app/outputs/flutter-apk/family-todo-release.apk

      - name: Verify APK signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="/tmp/family_todo_mobile/build/app/outputs/flutter-apk/family-todo-release.apk"
          # Find apksigner in common locations
          APKSIGNER=""
          for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android /opt/android "$HOME"; do
            if [ -n "$d" ] && [ -d "$d" ]; then
              found="$(find "$d" -maxdepth 6 -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
              if [ -n "$found" ]; then
                APKSIGNER="$found"
                break
              fi
            fi
          done
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::Android apksigner was not found — skipping signing verification."
            exit 0
          fi
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH")"
          echo "$CERT_OUTPUT"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*SHA-1 digest:[[:space:]]*//p' | head -n1 | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
          echo "APK signing SHA1 hex: ${ACTUAL_SHA1}"
          if [ -z "$ACTUAL_SHA1" ]; then
            echo "::error::Failed to read APK signing SHA1 fingerprint."
            exit 1
          fi
          if ! echo ",${ALLOWED_SIGN_SHA1_HEX}," | grep -Fq ",${ACTUAL_SHA1},"; then
            if [ "${SIGNING_KEY_SOURCE:-}" = "fallback" ]; then
              echo "::warning::APK uses fallback signing key ${ACTUAL_SHA1}. Configure RELEASE_KEYSTORE_* secrets for stable production signing."
              exit 0
            fi
            echo "::error::APK signing fingerprint is not registered in Firebase. Got ${ACTUAL_SHA1}; allowed ${ALLOWED_SIGN_SHA1_HEX}."
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-todo-release-apk
          path: /tmp/family_todo_mobile/build/app/outputs/flutter-apk/family-todo-release.apk

      - name: Publish GitHub Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: Mobile APK v${{ github.run_number }}
          files: /tmp/family_todo_mobile/build/app/outputs/flutter-apk/family-todo-release.apk
          generate_release_notes: true

      - name: Update latest tag and release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="/tmp/family_todo_mobile/build/app/outputs/flutter-apk/family-todo-release.apk"

          # If the versioned release step failed, create it now via gh CLI
          if [ "${{ steps.release.outcome }}" != "success" ]; then
            echo "softprops release failed — creating via gh CLI"
            gh release create "mobile-v${{ github.run_number }}" \
              --title "Mobile APK v${{ github.run_number }}" \
              --notes "Сборка #${{ github.run_number }} | Коммит ${{ github.sha }}" \
              "$APK" || echo "Versioned release creation also failed — continuing"
          fi

          # Force-update the 'latest' tag to current commit
          git tag -f latest
          git push origin latest --force || echo "::warning::Failed to push latest tag (may be rate-limited)"

          # Delete old latest release if exists (ignore error)
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          # Create new latest release
          gh release create latest \
            --title "Latest Mobile APK" \
            --notes "Сборка #${{ github.run_number }} | Коммит ${{ github.sha }}" \
            "$APK" || echo "::warning::Failed to create latest release (may be rate-limited)"
