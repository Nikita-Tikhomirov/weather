name: Build Flutter APK

on:
  push:
    branches: [master]
    paths:
      - 'mobile_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24'
          channel: 'stable'

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: |
            /opt/hostedtoolcache/flutter
            ~/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('mobile_app/pubspec.lock') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release
        env:
          APP_VERSION: ${{ github.ref_name }}-${{ github.sha }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-todo-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
